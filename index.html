
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas PPAW Week 6</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Tugas PPAW Week 6</h1>
        <p>JavaScript DOM, Event Handling, dan Fetch API</p>
    </header>

    <main>
        <section>
            <h2>1. Data Produk</h2>
            <button id="btnProduk">Muat Produk</button>
            <p id="statusProduk"></p>
            <div id="daftarProduk" class="produk-grid"></div>
        </section>

        <section>
            <h2>2. Form Pendaftaran</h2>
            <form id="formPendaftaran" novalidate>
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama"
                       placeholder="Masukkan nama">

                <label for="email">Email</label>
                <input type="email" id="email"
                       placeholder="Masukkan email">

                <label for="umur">Umur</label>
                <input type="number" id="umur"
                       placeholder="Masukkan umur">

                <button type="submit">Daftar</button>
            </form>

            <div id="hasilForm" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
